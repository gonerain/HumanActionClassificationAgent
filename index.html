<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene Presence Monitor</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    #status {
      margin: 10px 0;
      font-size: 1.2em;
      font-weight: bold;
    }
    #frame {
      border: 2px solid #ccc;
      max-width: 100%;
      height: auto;
    }
    #info {
      margin-top: 10px;
      font-size: 1em;
      color: #555;
    }
    section {
      margin-top: 20px;
    }
    button {
      padding: 6px 12px;
      margin-right: 6px;
    }
    pre {
      background: #fff;
      padding: 10px;
      border: 1px solid #ccc;
      overflow-x: auto;
    }
    #alarm {
      margin: 8px 0;
      padding: 8px;
      color: #fff;
      background: #d32f2f;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Scene Presence Monitor (Multi-Camera)</h1>

  <section id="cameraSection">
    <h2>Cameras</h2>
    <div>
      <button id="refreshCamerasBtn">Refresh</button>
      <label>
        Select:
        <select id="cameraSelect"></select>
      </label>
      <button id="deleteCameraBtn">Delete</button>
    </div>
    <pre id="camerasList"></pre>
  </section>

  <section id="liveSection">
    <h2>Live</h2>
    <div id="status">No camera selected</div>
    <div id="alarm"></div>
    <img id="frame" src="" alt="Live Feed">
    <div id="info"></div>
    <div id="coilViz" style="margin-top:12px;">
      <canvas id="coilCanvas" width="600" height="80" style="background:#fff; border:1px solid #ccc;"></canvas>
      <div id="coilText" style="margin-top:6px; color:#333;"></div>
    </div>
  </section>

  <section id="snapshotSection">
    <h2>Snapshot</h2>
    <button id="snapshotBtn">Fetch Snapshot</button>
    <img id="snapshot" src="" alt="Snapshot" style="display:none; border:2px solid #ccc; max-width:100%; height:auto;">
    <pre id="snapshotInfo"></pre>
  </section>

  <section id="reportSection">
    <h2>Inference Report</h2>
    <button id="reportBtn">Fetch Report</button>
    <pre id="reportInfo"></pre>
  </section>

  <section id="dwellSection">
    <h2>Dwell Events</h2>
    <button id="dwellBtn">Fetch Dwell Events</button>
    <pre id="dwellInfo"></pre>
  </section>

  <section id="manageSection">
    <h2>Create / Update Camera</h2>
    <div>
      <input type="text" id="camNameInput" placeholder="Name (e.g. camA)">
      <input type="text" id="sourceInput" placeholder="Source (e.g. 0 or rtsp://..)">
      <input type="text" id="regionInput" placeholder='Region JSON e.g. [[0,0],[100,0]]'>
    </div>
    <div style="margin-top:8px;">
      <button id="createCameraBtn">Create</button>
      <button id="updateCameraBtn">Update Selected</button>
    </div>
    <pre id="manageStatus"></pre>
  </section>

  <script>
    const statusDiv = document.getElementById("status");
    const frameImg = document.getElementById("frame");
    const infoDiv = document.getElementById("info");
    const alarmDiv = document.getElementById("alarm");
    const coilCanvas = document.getElementById("coilCanvas");
    const coilText = document.getElementById("coilText");
    const cameraSelect = document.getElementById("cameraSelect");
    const camerasList = document.getElementById("camerasList");
    const refreshCamerasBtn = document.getElementById("refreshCamerasBtn");
    const deleteCameraBtn = document.getElementById("deleteCameraBtn");
    const snapshotBtn = document.getElementById("snapshotBtn");
    const snapshotImg = document.getElementById("snapshot");
    const snapshotInfo = document.getElementById("snapshotInfo");
    const reportBtn = document.getElementById("reportBtn");
    const reportInfo = document.getElementById("reportInfo");
    const dwellBtn = document.getElementById("dwellBtn");
    const dwellInfo = document.getElementById("dwellInfo");
    const camNameInput = document.getElementById("camNameInput");
    const sourceInput = document.getElementById("sourceInput");
    const regionInput = document.getElementById("regionInput");
    const createCameraBtn = document.getElementById("createCameraBtn");
    const updateCameraBtn = document.getElementById("updateCameraBtn");
    const manageStatus = document.getElementById("manageStatus");

    let socket = null;
    const wsProto = location.protocol === "https:" ? "wss" : "ws";

    function closeSocket() {
      if (socket) {
        try { socket.close(); } catch(e) {}
      }
      socket = null;
    }

    function connectWS(cameraId) {
      closeSocket();
      statusDiv.textContent = "Connecting...";
      socket = new WebSocket(`${wsProto}://${location.host}/cameras/${cameraId}/status`);
      socket.onopen = () => {
        statusDiv.textContent = `✅ Connected to camera ${cameraId}`;
      };
      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.frame) {
          frameImg.src = "data:image/jpeg;base64," + data.frame;
        }
        statusDiv.textContent = data.scene_active
          ? `🟢 Camera ${cameraId}: 有人在岗`
          : `🔴 Camera ${cameraId}: 无人在岗`;
        const roll = data.roll || {};
        const coilNum = roll.coil_number ?? 'n/a';
        const processedM = typeof roll.processed_m === 'number' ? roll.processed_m : NaN;
        const remainingM = typeof roll.remaining_m === 'number' ? roll.remaining_m : NaN;
        const totalM = typeof roll.total_m === 'number' ? roll.total_m : NaN;
        infoDiv.innerHTML = `
          <strong>Active IDs:</strong> ${Array.isArray(data.active_ids) ? data.active_ids.join(", ") : ''}<br>
          <strong>Roll Status:</strong> ${data.roll_status}<br>
          <strong>Coil #:</strong> ${coilNum} &nbsp; <strong>Processed:</strong> ${isFinite(processedM)?processedM.toFixed(1):'n/a'} m &nbsp; <strong>Remaining:</strong> ${isFinite(remainingM)?remainingM.toFixed(1):'n/a'} m<br>
          <strong>Health:</strong> ${data.health ? data.health.status : 'n/a'}
        `;
        // Draw coil visualization: a circle with a baseline to the right.
        if (coilCanvas && coilCanvas.getContext && isFinite(totalM) && isFinite(processedM)) {
          const ctx = coilCanvas.getContext('2d');
          const w = coilCanvas.width, h = coilCanvas.height;
          ctx.clearRect(0, 0, w, h);
          // Baseline
          const baselineY = Math.floor(h/2)+10;
          const startX = 50; // circle center x
          const endX = w - 20;
          ctx.strokeStyle = '#777';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(startX, baselineY);
          ctx.lineTo(endX, baselineY);
          ctx.stroke();

          // Circle (coil)
          const r = 20;
          ctx.fillStyle = '#3f51b5';
          ctx.beginPath();
          ctx.arc(startX, baselineY - r, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#2c3e9e';
          ctx.stroke();

          // Progress marker along baseline (0..totalM maps from startX to endX)
          const usable = endX - (startX + r + 8);
          const px0 = startX + r + 8;
          const ratio = Math.max(0, Math.min(1, processedM / totalM));
          const px = px0 + usable * ratio;
          // Draw processed segment
          ctx.strokeStyle = '#4caf50';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(px0, baselineY);
          ctx.lineTo(px, baselineY);
          ctx.stroke();
          // Draw remaining segment (light gray overlay is baseline already)

          // Tick and label at current position
          ctx.strokeStyle = '#4caf50';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(px, baselineY - 8);
          ctx.lineTo(px, baselineY + 8);
          ctx.stroke();

          // Head/Tail 200m windows (shaded)
          if (isFinite(totalM)) {
            const win = 200;
            const headPx = px0 + usable * Math.max(0, Math.min(1, win / totalM));
            const tailStartRatio = Math.max(0, Math.min(1, (totalM - win) / totalM));
            const tailStartPx = px0 + usable * tailStartRatio;
            ctx.fillStyle = 'rgba(33,150,243,0.15)';
            ctx.fillRect(px0, baselineY - 6, Math.max(0, headPx - px0), 12);
            ctx.fillStyle = 'rgba(244,67,54,0.15)';
            ctx.fillRect(tailStartPx, baselineY - 6, Math.max(0, (px0 + usable) - tailStartPx), 12);
          }

          // Text summary
          coilText.textContent = `卷 #${coilNum} | 已过 ${processedM.toFixed(1)} m | 剩余 ${remainingM.toFixed(1)} m / 共 ${totalM.toFixed(0)} m`;
        } else {
          coilText.textContent = '';
        }
        if (data.alarm) {
          alarmDiv.style.display = 'block';
          alarmDiv.textContent = `⚠️ 异常：${data.alarm_message || 'unknown'}`;
        } else {
          alarmDiv.style.display = 'none';
          alarmDiv.textContent = '';
        }
      };
      socket.onerror = () => { statusDiv.textContent = `❌ Camera ${cameraId} WebSocket error`; };
      socket.onclose = () => { statusDiv.textContent = `🔌 Camera ${cameraId} WebSocket closed`; };
    }

    async function loadCameras() {
      const resp = await fetch('/cameras');
      const cams = await resp.json();
      camerasList.textContent = JSON.stringify(cams, null, 2);
      cameraSelect.innerHTML = '';
      for (const cam of cams) {
        const opt = document.createElement('option');
        opt.value = cam.id;
        opt.textContent = `#${cam.id} ${cam.name} (${cam.running ? 'running' : 'stopped'})`;
        cameraSelect.appendChild(opt);
      }
      if (cams.length > 0) {
        cameraSelect.value = cams[0].id;
        connectWS(cams[0].id);
      } else {
        statusDiv.textContent = 'No camera selected';
        closeSocket();
        frameImg.src = '';
        infoDiv.textContent = '';
      }
    }

    refreshCamerasBtn.onclick = loadCameras;
    cameraSelect.onchange = () => {
      const id = cameraSelect.value;
      if (id) connectWS(id);
    };

    deleteCameraBtn.onclick = async () => {
      const id = cameraSelect.value;
      if (!id) return;
      await fetch(`/cameras/${id}`, { method: 'DELETE' });
      await loadCameras();
    };

    snapshotBtn.onclick = async () => {
      const id = cameraSelect.value;
      if (!id) return;
      const resp = await fetch(`/cameras/${id}/snapshot`);
      const data = await resp.json();
      if (data.frame) {
        snapshotImg.src = "data:image/jpeg;base64," + data.frame;
        snapshotImg.style.display = "block";
      }
      snapshotInfo.textContent = JSON.stringify(data, null, 2);
    };

    reportBtn.onclick = async () => {
      const id = cameraSelect.value;
      if (!id) return;
      const resp = await fetch(`/cameras/${id}/inference/report`);
      const data = await resp.json();
      reportInfo.textContent = JSON.stringify(data, null, 2);
    };

    dwellBtn.onclick = async () => {
      const id = cameraSelect.value;
      if (!id) return;
      const resp = await fetch(`/cameras/${id}/dwell_events`);
      const data = await resp.json();
      dwellInfo.textContent = JSON.stringify(data, null, 2);
    };

    createCameraBtn.onclick = async () => {
      const name = camNameInput.value.trim() || undefined;
      const source = sourceInput.value.trim() || undefined;
      let region = undefined;
      const regionVal = regionInput.value.trim();
      if (regionVal) {
        try { region = JSON.parse(regionVal); } catch (e) { manageStatus.textContent = 'Invalid region JSON'; return; }
      }
      const resp = await fetch('/cameras', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, source, region })
      });
      const data = await resp.json();
      manageStatus.textContent = JSON.stringify(data, null, 2);
      await loadCameras();
    };

    updateCameraBtn.onclick = async () => {
      const id = cameraSelect.value;
      if (!id) return;
      const payload = {};
      if (camNameInput.value.trim()) payload.name = camNameInput.value.trim();
      if (sourceInput.value.trim()) payload.source = sourceInput.value.trim();
      if (regionInput.value.trim()) {
        try { payload.region = JSON.parse(regionInput.value.trim()); } catch (e) { manageStatus.textContent = 'Invalid region JSON'; return; }
      }
      const resp = await fetch(`/cameras/${id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      manageStatus.textContent = JSON.stringify(data, null, 2);
      await loadCameras();
    };

    // initial load
    loadCameras();
  </script>
</body>
</html>
